# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "emt" ]
  pull_request:
    branches: [ "emt" ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'
    - name: Download ios18 patched SDk
      run: |
        curl -L -o iPhoneOS18.0.sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.0-SDKs/iPhoneOS18.0.sdk.zip
        unzip iPhoneOS18.0.sdk.zip
    - name: Build
      run: |
        rm -rf .build

        SDK_PATH="$(pwd)/iPhoneOS18.0.sdk"   # adjust if the folder name is different

        swift build -c release \
            --triple arm64-apple-ios14.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            -Xswiftc -target -Xswiftc arm64-apple-ios14.0 \
            -Xswiftc -Osize

        mkdir -p tmp/arm64
        cp .build/release/libJinx.a tmp/arm64/
        cp -r .build/release/Modules/Jinx.swiftmodule tmp/arm64/


        swift build -c release \
            --triple arm64e-apple-ios14.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            -Xswiftc -target -Xswiftc arm64e-apple-ios14.0 \
            -Xswiftc -Osize

        mkdir -p tmp/arm64e
        cp .build/release/libJinx.a tmp/arm64e/
        cp -r .build/release/Modules/Jinx.swiftmodule tmp/arm64e/

    - name: Prepare framework for Theos
      run: |
        mkdir -p built-framework/Jinx
        
        lipo -create -output libJinx.a tmp/arm64/libJinx.a tmp/arm64e/libJinx.a
        cp libJinx.a built-framework/Jinx/
        
        mkdir built-framework/Jinx/Jinx.swiftmodule
        cp tmp/arm64/Jinx.swiftmodule built-framework/Jinx/Jinx.swiftmodule/arm64-apple-ios.swiftmodule
        cp tmp/arm64e/Jinx.swiftmodule built-framework/Jinx/Jinx.swiftmodule/arm64e-apple-ios.swiftmodule

    - name: Upload Jinx static library
      uses: actions/upload-artifact@v4
      with:
        name: Jinx-framework-ios
        path: built-framework/
